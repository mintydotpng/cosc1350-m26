<div id="calcbox">
    <h1>Tip Calculator</h1>
        <p>Bill Amount:</p>
        <input type="text" id="billamount" placeholder="Enter bill amount">
        <p>Service Quality:</p>
        <select name="tip" id="tip">
            <option value="0.25">Excellent - 25%</option>
            <option value="0.20">Good - 20%</option>
            <option value="0.15">Fair - 15%</option>
            <option value="0.10">Poor - 10%</option>
        </select>
    <div id="calcresults">
        <button id="calculate">Calculate Tip</button>
        <p>Tip:</p><span id="tipamount">0</span> | Total: <span id="totalamount">0</span>
    </div>
</div>
